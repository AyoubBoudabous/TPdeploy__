<div class="container">
    <h3>Ajout d'un jeu</h3>
    <form>
        <div>
            <label for="gameName">Nom</label>
            <input type="text" id="gameName" >
        </div>
        <div>
            <label for="gamePrice">Prix</label>
            <input type="number" id="gamePrice" >
        </div>

        <div>
            <label> Made In </label>
            <label>
                <input type="radio" value="Tunisie" >Tunisie
            </label>
            <label>
                <input type="radio" value="Autre" >Autre
            </label>
        </div>
        <div>
            <label for="gameCategory">Catégorie</label>
            <select id="gameCategory" >


            </select>
        </div>
        <div>
            <label for="gameIsNew">
                <input type="checkbox" id="gameIsNew" > Nouveau
            </label>
        </div>

        <div>
            <input type="submit" class="btn btn-success" value="Ajouter">
            <input type="reset" class="btn btn-warning"  value="Effacer">
        </div>
    </form>

</div>
